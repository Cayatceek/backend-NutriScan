services:
  api:
    build:
      context: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      NUTRISCAN_DATABASE_URL: postgresql+psycopg://nutriscan_user:nutriscan_pass@db:5432/nutriscan
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutriscan
      POSTGRES_USER: nutriscan_user
      POSTGRES_PASSWORD: nutriscan_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutriscan_user -d nutriscan"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
